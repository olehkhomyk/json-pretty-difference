[package]
name = "json-diff-app"
version = "0.1.5"
description = "Private, offline JSON formatter and semantic diff for macOS"
authors = ["JSON Diff"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "json_diff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "json-diff"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

